name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check server/
      - run: ruff format --check server/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest --cov=server --cov-report=term-missing --cov-fail-under=80

  lighthouse:
    name: Lighthouse Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The accessibility audit only needs the served HTML, so we serve the
      # static frontend (python http.server) rather than booting the full app
      # — deterministic and free of network/startup timing.
      - name: Run Lighthouse CI (fails if Accessibility < 0.90)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
